name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Formatting and TypeScript
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check TypeScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      
      - name: Check schema compatibility
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run schema:check
  integration:
    name: MongoDB integration tests
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm
    timeout-minutes: 10

    services:
      mongo:
        image: mongo:9.0
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    env:
      TEST_MONGO_URL: mongodb://mongo:27017
      TEST_MONGO_DB: graphql_engineering_lab_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
