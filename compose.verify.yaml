# Optional sandbox override; never loaded unless passed with -f.
# Requires Docker Compose 2.24.4+ for !override.
# Use with project name graphql-lab-readme-check; see docs/setup-verification.md.
services:
  backend:
    ports: !override
      - "127.0.0.1:4002:4000"
    environment:
      AUTH_ALLOWED_ORIGIN: http://localhost:4002

  jaeger:
    ports: !override
      - "127.0.0.1:16688:16686"

volumes:
  backend-dependencies:
    name: graphql-lab-readme-check-node-modules

  user-service-dependencies:
    name: graphql-lab-readme-check-user-service-node-modules
