services:
  backend:
    image: node:26-alpine
    working_dir: /app
    user: "${LOCAL_UID:?Set LOCAL_UID}:${LOCAL_GID:?Set LOCAL_GID}"
    volumes:
      - ./backend:/app
      - backend-dependencies:/app/node_modules
    ports:
      - "127.0.0.1:4000:4000"
    command: npm run dev
    environment:
      npm_config_cache: /tmp/npm-cache
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: graphql_engineering_lab
      OTEL_SERVICE_NAME: graphql-engineering-lab
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:9.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
  k6:
    image: grafana/k6:1.0.0
    profiles:
      - loadtest
    volumes:
      - ./load-tests:/scripts:ro
    command: run /scripts/posts.js

volumes:
  mongo-data:
  backend-dependencies:
    external: true
    name: graphql-lab-node-modules
