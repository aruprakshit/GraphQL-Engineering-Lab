services:
  backend:
    image: node:26-alpine
    working_dir: /app
    user: "${LOCAL_UID:?Set LOCAL_UID}:${LOCAL_GID:?Set LOCAL_GID}"
    environment:
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./backend:/app
      - backend-dependencies:/app/node_modules
    ports:
      - "127.0.0.1:4000:4000"
    command: npm run dev

volumes:
  backend-dependencies:
    external: true
    name: graphql-lab-node-modules
