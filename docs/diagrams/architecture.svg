<text x="643" y="490">Origin/header + attempt guards</text>
<text x="643" y="518">Verify password: async scrypt</text>
<text x="643" y="546">Max 2 checks per process</text>
<text x="643" y="574">Store session token hash</text>
<text x="643" y="602">HttpOnly cookie + public identity</text>
