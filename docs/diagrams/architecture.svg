<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">GraphQL Engineering Lab — current architecture</title>
<desc id="desc">Local Docker Compose application. A browser or curl reaches one Express backend on port 4000. GraphQL creates request context and dispatches to paginated post queries with a request-scoped DataLoader or guarded login with scrypt and session issuance. Both use MongoDB. OpenTelemetry exports traces to Jaeger. k6, isolated integration tests and GitHub Actions support verification. Incoming session authentication and authorization enforcement are future work.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43566e"/></marker>
  <style>
    text {font-family:Arial,Helvetica,sans-serif;fill:#19304a;font-size:17px}
    .title {font-size:30px;font-weight:700}.heading{font-size:20px;font-weight:700}.small{font-size:15px}.label{font-size:16px;font-weight:700}.muted{fill:#52657b}
    .boundary{fill:#f6f9fc;stroke:#92a6bc;stroke-width:2}.box{fill:white;stroke:#bdccda;stroke-width:1.5}.blue{fill:#eaf3ff;stroke:#618fc4;stroke-width:1.5}.green{fill:#edf7f1;stroke:#73a589;stroke-width:1.5}.orange{fill:#fff5e8;stroke:#c79952;stroke-width:1.5}.line{fill:none;stroke:#43566e;stroke-width:2;marker-end:url(#arrow)}.trace{fill:none;stroke:#43566e;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
  </style>
</defs>
