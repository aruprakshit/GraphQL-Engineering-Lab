<rect x="350" y="430" width="250" height="190" rx="7" class="blue"/>
<text x="368" y="459" class="label">3A  posts query</text>
<text x="368" y="490">Validate first + cursor</text>
<text x="368" y="518">Sorted page; fetch first + 1</text>
<text x="368" y="546">author → userLoader.load()</text>
<text x="368" y="574">Batch unique IDs with $in</text>
<text x="368" y="602" class="small">Cache lasts one request</text>
