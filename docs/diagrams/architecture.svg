<text x="58" y="945" class="small">GitHub Actions: format check, typecheck, unit tests, integration tests</text>
<rect x="725" y="865" width="675" height="93" rx="8" fill="#fafafa" stroke="#92a6bc" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="743" y="894" class="label">Future work — outside the current request path</text>
<text x="743" y="922">Cookie → actor · me / logout · authorization enforcement</text>
<text x="743" y="945" class="small">Depth / complexity protection · schema evolution · federation exercise</text>
<text x="40" y="1001" class="label">Read path: client → Express → GraphQL → posts → DataLoader → MongoDB</text>
<text x="40" y="1033" class="label">Login path: client → guards → credentials → session storage → cookie</text>
<text x="40" y="1072" class="small muted">Solid arrows: application/database calls. Dashed arrow: telemetry export. Inner backend boxes are modules, not separate services.</text>
